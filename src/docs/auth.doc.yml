paths:
  /api/auth/sign-up:
    post:
      tags:
        - Authentication
      summary: Inscription d'un nouvel utilisateur
      description: Crée un nouveau compte utilisateur avec email, username et mot de passe. Retourne un token JWT valide 7 jours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            examples:
              example1:
                summary: Exemple d'inscription
                value:
                  email: "user@example.com"
                  username: "johndoe"
                  password: "securePassword123"
      responses:
        '201':
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    message: "Utilisateur créé avec succès"
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: 1
                      username: "johndoe"
                      email: "user@example.com"
        '400':
          description: Champs manquants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingFields:
                  value:
                    error: "Email, username et mot de passe sont requis"
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailExists:
                  value:
                    error: "Un utilisateur avec cet email existe déjà"
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                serverError:
                  value:
                    error: "Erreur serveur"

  /api/auth/sign-in:
    post:
      tags:
        - Authentication
      summary: Connexion d'un utilisateur
      description: Authentifie un utilisateur existant avec son email et mot de passe. Retourne un token JWT valide 7 jours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            examples:
              example1:
                summary: Exemple de connexion
                value:
                  email: "user@example.com"
                  password: "securePassword123"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    message: "Connexion réussie"
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: 1
                      username: "johndoe"
                      email: "user@example.com"
        '401':
          description: Échec d'authentification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    error: "Email ou mot de passe incorrect"
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                serverError:
                  value:
                    error: "Erreur serveur"
